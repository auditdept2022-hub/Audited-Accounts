name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project (outside the repo, nothing is committed)
        run: |
          mkdir -p "$RUNNER_TEMP/app/www"
          cd "$RUNNER_TEMP/app"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          # Copy the site's files into the app
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            "$GITHUB_WORKSPACE/" www/
          npx cap init "Audited Accounts" com.auditdept.auditedaccounts --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/app/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audited-Accounts-apk
          path: ${{ runner.temp }}/app/android/app/build/outputs/apk/debug/app-debug.apk
