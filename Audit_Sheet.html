  { test:()=>ynTrue('reportsAttachments.dailyPerfReconciled'), pos:'Daily performance is reconciled to the collection report.' },
  { test:()=>ynTrue('reportsAttachments.attachmentsComplete'), pos:'All attachments of the reports are complete.' },
  { test:()=>ynTrue('reportsAttachments.last7DaysFiled'), pos:'The last 7 days of transactions are filed with complete attachments.' },
  { test:()=>ynTrue('officialReceipts.greenCopiesFiledSeries'), pos:'Green copies of used OR / SI / DR are filed in series.' },
  { test:()=>ynTrue('fieldCollection.picturesOnTime'), pos:'Collectors are submitting field collection pictures on time.' },
  { test:()=>ynTrue('fieldCollection.copiesMonitored'), pos:'Field picture copies are properly monitored by the cashier.' },
  { test:()=>ynTrue('notebooks.noPendingChattel'), pos:'Branch is without pending chattel documents.' },
  { test:()=>condGood('inventory.repairUnits'), pos:()=>'Repair units (if any) are properly accounted for'+countSuffix('inventory.repairUnits')+'.' },
  { test:()=>condGood('image.branchVaultKey'), pos:'The branch vault key is properly secured.' },
  { test:()=>statusGood('inventory.tools'), pos:'Company-owned tools are complete.' },
  { test:()=>statusGood('inventory.spareparts'), pos:'Spareparts (3S shop) are complete.' },
  { test:()=>statusGood('inventory.platesOrCr'), pos:'Plates and OR-CR are complete.' }
];
function buildBranchBullets(){
  const bullets = FINDINGS_RULES.filter(r=>{ try{ return !!r.test(); }catch(e){ return false; } })
    .map(r=> typeof r.pos === 'function' ? r.pos() : r.pos);
  const orRemarks = get('officialReceipts.tableRemarks');
  if(orRemarks && String(orRemarks).trim()) bullets.push('OR / SI / DR remarks: ' + String(orRemarks).trim());
  return bullets;
}
function buildIssuesBullets(){
  return (state.findings||[]).filter(f=>f && f.text && String(f.text).trim())
    .map(f=>'['+(f.severity||'Medium')+'] '+String(f.text).trim());
}
function buildFieldBullets(){
  const bullets = ['Confirmation of accounts (c/o audit department with spreadsheets).'];
  const remarks = get('confirmation.remarks');
  if(remarks && String(remarks).trim()) bullets.push('Remarks: ' + String(remarks).trim());
  return bullets;
}
function buildPreviewHtml(){
  const branchBullets = buildBranchBullets();
  const issues = buildIssuesBullets();
  const fieldBullets = buildFieldBullets();
  const dateStr = fmtLongDateUpper(state.auditDate);
  const branchName = state.branch ? escHtml(state.branch) : 'BRANCH NAME';
  let html = '';
  html += '<div class="pv-branch">'+branchName+'</div>';
  html += '<div class="pv-title">AUDIT FINDINGS</div>';
  html += '<div class="pv-date">'+(dateStr ? escHtml(dateStr) : '\u2014')+'</div>';
  html += '<div class="pv-section">BRANCH</div>';
  if(branchBullets.length){
    html += '<ol class="pv-list">' + branchBullets.map(b=>'<li>'+escHtml(b)+'</li>').join('') + '</ol>';
  } else {
    html += '<ol class="pv-list"><li>(Fill in the checklist first, or type findings here.)</li></ol>';
  }
  if(issues.length){
    html += '<div class="pv-section">ISSUES NOTED</div>';
    html += '<ol class="pv-list">' + issues.map(b=>'<li>'+escHtml(b)+'</li>').join('') + '</ol>';
  }
  html += '<div class="pv-section">Field</div>';
  html += '<ol class="pv-list">' + fieldBullets.map(b=>'<li>'+escHtml(b)+'</li>').join('') + '</ol>';
  html += '<div class="pv-footer">'
    + '<div class="pv-sign"><div class="pv-sign-label">Prepared by:</div><div class="line">&nbsp;</div></div>'
    + '<div class="pv-sign"><div class="pv-sign-label">Acknowledged by:</div><div class="line">&nbsp;</div></div>'
    + '</div>';
  return html;
}
/* Plain-text version of the same narrative shown in the preview, used
   so the Apps Script backend can save it straight into the sheet (an
   "Audit Initial Report" tab) without having to re-implement the
   findings rules on the backend side. */
function buildPreviewPlainText(){
  const branchBullets = buildBranchBullets();
  const issues = buildIssuesBullets();
  const fieldBullets = buildFieldBullets();
  const dateStr = fmtLongDateUpper(state.auditDate);
  const branchName = state.branch || 'BRANCH NAME';
  const lines = [];
  lines.push(branchName);
  lines.push('AUDIT FINDINGS');
  lines.push(dateStr || '\u2014');
  lines.push('');
  lines.push('BRANCH');
  if(branchBullets.length) branchBullets.forEach(b=>lines.push('- '+b));
  else lines.push('- (Fill in the checklist first, or type findings here.)');
  if(issues.length){
    lines.push('');
    lines.push('ISSUES NOTED');
    issues.forEach(b=>lines.push('- '+b));
  }
  lines.push('');
  lines.push('FIELD');
  fieldBullets.forEach(b=>lines.push('- '+b));
  return lines.join('\n');
}
function openPreview(){
  // Auto-draft only the FIRST time this audit's preview is opened.
  // After that, whatever's in previewEditedHtml (your manual edits)
  // is reused as-is, so re-opening the preview never wipes your
  // wording changes. This document is standalone: editing it here
  // never touches `state`, so it can't change the checklist answers,
  // the score, or what gets saved to the main history/dashboard list.
  if(previewEditedHtml == null){
    previewEditedHtml = buildPreviewHtml();
  }
  document.getElementById('previewPage').innerHTML = previewEditedHtml;
  document.getElementById('previewOverlay').classList.add('open');
  document.getElementById('previewOverlay').setAttribute('aria-hidden','false');
  document.body.classList.add('previewing');
}
/* Keeps previewEditedHtml in sync as the auditor types, so the
   standalone document's latest wording survives a close/reopen of
   the overlay (and is what Print/Download/Submit use). Guarded so it
   never overwrites a real draft with an empty string if called before
   the preview has ever been opened this session (previewPage starts
   out blank in the DOM). */
function capturePreviewEdits(){
  const el = document.getElementById('previewPage');
  if(el && el.innerHTML.trim()) previewEditedHtml = el.innerHTML;
}
/* Converts the standalone preview's edited HTML back into the same
   plain-text line format buildPreviewPlainText() used to produce, so
   whatever the auditor actually edited is what lands in the "Audit
   Initial Report" sheet cell (which only stores plain text) — not a
   re-derived draft. Falls back gracefully for the signature footer,
   whose two "Prepared by / Acknowledged by" blocks aren't simple
   one-line divs. */
function htmlToPlainText(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const lines = [];
  tmp.childNodes.forEach(function(node){
    if(node.nodeType !== 1){
      const t = (node.textContent || '').trim();
      if(t) lines.push(t);
      return;
    }
    if(node.tagName === 'OL' || node.tagName === 'UL'){
      Array.from(node.children).forEach(function(li, i){
        const t = li.textContent.replace(/\u00a0/g,' ').trim();
        if(t) lines.push((i+1)+'. '+t);
      });
      return;
    }
    if(node.classList && node.classList.contains('pv-footer')){
      node.querySelectorAll('.pv-sign').forEach(function(sign){
        const label = sign.querySelector('.pv-sign-label');
        const line = sign.querySelector('.line');
        const labelText = label ? label.textContent.trim() : '';
        const lineText = line ? line.textContent.replace(/\u00a0/g,'').trim() : '';
        lines.push(labelText + (lineText ? ' ' + lineText : ''));
      });
      return;
    }
    lines.push(node.textContent.replace(/\u00a0/g,' ').trim());
  });
  // Collapse runs of blank lines to one, and trim leading/trailing blanks.
  const cleaned = [];
  lines.forEach(function(l){
    if(l === '' && cleaned.length && cleaned[cleaned.length-1] === '') return;
    cleaned.push(l);
  });
  while(cleaned.length && cleaned[0] === '') cleaned.shift();
  while(cleaned.length && cleaned[cleaned.length-1] === '') cleaned.pop();
  return cleaned.join('\n');
}
/* Throws away manual edits and rebuilds the document fresh from the
   current checklist answers — for when the checklist changed since
   you last edited the standalone preview and you want it back in
   sync, instead of hand-editing it again from scratch. */
function resetPreviewDraft(){
  if(!confirm('Discard your manual edits in this document and rebuild it from the current checklist answers?')) return;
  previewEditedHtml = buildPreviewHtml();
  document.getElementById('previewPage').innerHTML = previewEditedHtml;
  showToast('Preview rebuilt from the checklist \u2014 your previous edits were discarded.');
}
function closePreview(){
  capturePreviewEdits();
  document.getElementById('previewOverlay').classList.remove('open');
  document.getElementById('previewOverlay').setAttribute('aria-hidden','true');
  document.body.classList.remove('previewing');
}
/* The toolbar's Print icon used to call window.print() straight on
   the checklist screen, which is why printing didn't look like the
   Word doc — it was printing the wrong view. It now opens the same
   Word-style "AUDIT FINDINGS" preview first (same one the Preview
   button and Download use) and prints THAT, so print, preview, and
   the downloaded file all match the exact same document. */
function printFindings(){
  openPreview();
  setTimeout(()=>window.print(), 60);
}
function downloadPreviewDoc(){
  capturePreviewEdits();
  const pageEl = document.getElementById('previewPage');
  const content = pageEl.innerHTML;
  const safeBranch = (state.branch || 'Audit Findings').replace(/[\\/:*?"<>|]/g,'-').trim();
  const filename = 'Audit Findings - ' + safeBranch + (state.auditDate ? (' - '+state.auditDate) : '') + '.doc';
  // @page WordSection1 is the standard trick Word looks for when it opens
  // an HTML/.doc file: it sets the document's actual Page Setup (paper
  // size + margins) instead of leaving Word's own default, so this opens
  // already configured for a real 8.5in x 11in (Letter) sheet with 1in
  // margins on every side \u2014 ready to print immediately, no manual
  // Page Setup needed by whoever you send it to.
  const style = '@page WordSection1{size:8.5in 11.0in; margin:1.0in 1.0in 1.0in 1.0in; mso-page-orientation:portrait;}'
    + 'div.WordSection1{page:WordSection1;}'
    + 'body{font-family:Calibri,"Segoe UI",Arial,sans-serif; font-size:12pt; line-height:1.15; color:#111;}'
    + '.pv-branch,.pv-title,.pv-date{font-weight:normal; text-align:left; font-size:12pt;}'
    + '.pv-date{margin-bottom:20px;}'
    + '.pv-section{font-weight:bold; margin:16px 0 2px;}'
    + '.pv-list{margin:0 0 4px; padding-left:34px;}'
    + '.pv-list li{margin-bottom:2px;}'
    + '.pv-footer{width:100%; margin-top:56px;}'
    + '.pv-sign{display:inline-block; width:45%; vertical-align:top;}'
    + '.pv-sign-label{font-size:12pt;}'
    + '.pv-sign .line{margin-top:44px; padding-top:4px; font-size:12pt;}';
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>Audit Findings</title><style>'+style+'</style></head>'
    + '<body><div class="WordSection1">'+content+'</div></body></html>';
  const blob = new Blob(['\ufeff', doc], { type:'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast('Downloaded \u2014 opens in Word already set to 8.5\u2033\u00d711\u2033, ready to print.');
}

/* ============================================================
   SHARE (toolbar below header) — sends a quick text snapshot of
   the audit you're currently filling in via the device's native
   share sheet (Messenger shows up there on phones that have it
   installed). Falls back to copying the text if share isn't
   available, e.g. on most desktop browsers.
   ============================================================ */
async function shareCurrentAudit(){
  const score = computeScore();
  const lines = [
    'Branch Audit \u2014 ' + (state.branch || '(no branch yet)'),
    state.auditor ? 'Auditor: ' + state.auditor : null,
    state.auditDate ? 'Date: ' + state.auditDate : null,
    'Checklist so far: ' + score.pct + '% (' + score.yes + ' yes, ' + score.no + ' no)',
    state.findings.length ? 'Findings logged: ' + state.findings.length : null
  ].filter(Boolean);
  const text = lines.join('\n');

  if(navigator.share){
    try{ await navigator.share({ title: 'Branch Audit', text }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; /* user cancelled, fall through to copy */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('Sharing isn\u2019t available here \u2014 summary copied. Paste it into Messenger.');
  }catch(e){
    showToast('Couldn\u2019t share or copy automatically \u2014 select the Review section text manually.');
  }
}

async function doSubmit(){
  if(!state.branch){
    showToast('Please enter the branch name first.');
    document.getElementById('sec-basics').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if(!backendConfigured){
    showToast('Backend not configured yet \u2014 see the note in the review card.');
    return;
  }
  const isEdit = !!editingSubmissionId;
  const score = computeScore();
  const payload = JSON.parse(JSON.stringify(state));
  payload.score = score;
  if(isEdit) payload.submissionId = editingSubmissionId;
  // Save YOUR edited findings document, not the raw auto-draft, so
  // what lands in the "Audit Initial Report" sheet matches what you
  // actually reviewed. If the preview was never opened this session
  // (e.g. straight-to-submit without checking it), fall back to a
  // fresh auto-draft so the sheet is never left blank. The full HTML
  // is saved too (reportNarrativeHtml, inside the hidden data JSON)
  // so re-opening this exact audit for editing later can restore your
  // exact wording instead of just plain text.
  capturePreviewEdits();
  const narrativeHtml = previewEditedHtml != null ? previewEditedHtml : buildPreviewHtml();
  payload.reportNarrativeHtml = narrativeHtml;
  payload.reportNarrative = htmlToPlainText(narrativeHtml);

  submitting = true; render();
  try{
    // Content-Type: text/plain is deliberate — it keeps this a "simple"
    // request so the browser skips a CORS preflight OPTIONS call, which
    // Apps Script web apps don't answer well.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: isEdit ? 'update' : 'submit', data: payload })
    });
    const result = await res.json();
    submitting = false;
    if(result && result.ok){
      showToast(isEdit ? 'Audit updated \u2014 changes saved.' : 'Audit submitted \u2014 saved to its own tab and to Audit Initial Report.');
      saveHistoryEntry({
        submissionId: result.submissionId || editingSubmissionId || null,
        branch: payload.branch, auditor: payload.auditor, auditDate: payload.auditDate,
        submittedAt: new Date().toISOString(), score: score, state: payload
      });
      editingSubmissionId = null;
      state = freshState();
      previewEditedHtml = null;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
      renderBranchDrawer();
    } else {
      render();
      showToast('Could not '+(isEdit?'save changes':'submit')+': ' + (result && result.error ? result.error : 'unknown error'));
    }
  } catch(err){
    submitting = false;
    render();
    showToast('Could not reach the server: ' + err.message);
  }
}

/* Loads a previously-submitted audit's full state back into the form
   so it can be edited, then saved with "Save changes" (which updates
   the existing sheet tab/index row instead of creating a new one). */
function editAuditFromReport(){
  const list = historyCache || loadLocalHistory();
  const h = list[openReportIdx];
  if(!h || !h.state){ showToast('Full data for this audit isn\u2019t available on this device \u2014 open it on the device that submitted it, or check the shared Sheet directly.'); return; }
  if((state.branch || editingSubmissionId) && !confirm('Discard the audit currently on screen and load this one for editing?')) return;
  state = JSON.parse(JSON.stringify(h.state));
  editingSubmissionId = h.submissionId || null;
  // Restore the exact findings document you last saved for THIS audit
  // (if it has one) instead of wiping it, so opening the preview shows
  // the same edited wording you left it with \u2014 not a fresh re-draft.
  // Older audits saved before this feature existed won't have it, so
  // they'll simply auto-draft fresh the first time you open the preview.
  previewEditedHtml = (h.state && h.state.reportNarrativeHtml) ? h.state.reportNarrativeHtml : null;
  closeReport();
  closeBranchMenu();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  showToast(editingSubmissionId
    ? 'Editing this audit \u2014 make your changes, then tap Save changes.'
    : 'Editing this audit \u2014 it has no submission ID on record, so saving will create a new tab instead of updating the old one.');
}

/** Stops editing and clears the form, after a confirmation. */
function cancelEdit(){
  if(!confirm('Discard changes and stop editing this audit?')) return;
  editingSubmissionId = null;
  state = freshState();
  previewEditedHtml = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* Permanently deletes a submitted audit: its detail sheet tab, its
   "Audit Index" row, and its "Audit Initial Report" row. Always asks
   for confirmation first, since this can't be undone. */
async function deleteAuditFromReport(){
  const list = historyCache || loadLocalHistory();
  const h = list[openReportIdx];
  if(!h) return;
  const label = (h.branch || 'This audit') + (h.auditDate ? ' \u2014 ' + h.auditDate : '');
  if(!confirm('Delete this audit permanently?\n\n' + label + '\n\nThis removes its sheet tab from the spreadsheet and cannot be undone.')) return;
  if(!backendConfigured){ showToast('Backend not configured yet \u2014 cannot delete.'); return; }
  if(!h.submissionId){ showToast('This audit has no submission ID on record, so it can\u2019t be deleted remotely \u2014 remove its tab directly in the Sheet instead.'); return; }
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', data:{ submissionId: h.submissionId } })
    });
    const result = await res.json();
    if(result && result.ok){
      showToast('Audit deleted.');
      closeReport();
      historyCache = (historyCache || []).filter(x => x.submissionId !== h.submissionId);
      saveLocalHistoryCache(historyCache);
      renderBranchDrawer();
    } else {
      showToast('Could not delete: ' + (result && result.error ? result.error : 'unknown error'));
    }
  } catch(err){
    showToast('Could not reach the server: ' + err.message);
  }
}

/* branch list (optional) — GET request, also a "simple" request so no preflight */
let knownBranches = [];
let branchesLoading = false;

/* Auto-refreshes the branch list in the background (so a branch added
   to the "Branches" sheet tab shows up without a manual page reload),
   but only touches the datalist DOM when the fetched list is actually
   different from what's already loaded — if nothing changed, it stays
   completely still: no re-render, no flicker, no disturbing whatever
   the person is doing (e.g. mid-typing in the branch field). */
async function loadBranches(isInitial){
  if(!backendConfigured){ if(isInitial) renderBranchDrawer(); return; }
  if(branchesLoading) return;
  branchesLoading = true;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=branches&_=' + Date.now(), { cache: 'no-store' });
    const result = await res.json();
    if(result && Array.isArray(result.branches)){
      const changed = result.branches.length !== knownBranches.length
        || result.branches.some((b,i)=> b !== knownBranches[i]);
      if(changed){
        knownBranches = result.branches;
        const dl = document.getElementById('branchList');
        if(dl) dl.innerHTML = knownBranches.map(b=>'<option value="'+escAttr(b)+'"></option>').join('');
      }
    }
  }catch(e){ /* non-fatal — free text still works */ }
  branchesLoading = false;
  if(isInitial) renderBranchDrawer();
}
/* Background refresh: every 5 minutes, and whenever the tab/app comes
   back into focus (covers the common case of leaving the form open on
   a phone, switching away, then coming back later). loadBranches()
   itself decides whether anything actually needs to change, and these
   background calls never touch the branch drawer/history view — only
   the very first load on page open does that. */
setInterval(loadBranches, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadBranches(); });

/* ============================================================
   HEADER — back to dashboard + hamburger branch menu
   ============================================================ */
function goToDashboard(){
  window.location.href = 'index.html';
}

function fmtDate(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})
      + ' \u00b7 ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }catch(e){ return iso; }
}

function syncStatusBanner_(status, detail){
  if(status === 'live') return '<div class="drawer-hint" style="color:var(--ok);">&#10003; Synced with the shared Sheet just now.</div>';
  if(status === 'unconfigured' || status === 'checking') return '';
  const msg = status === 'stale-backend'
    ? 'Couldn\u2019t confirm a live sync (backend looks out of date) \u2014 showing this device\u2019s last saved copy.'
    : 'Couldn\u2019t reach the server \u2014 showing this device\u2019s last saved copy.';
  return '<div class="banner" style="margin:0 0 10px;" title="'+escAttr(detail||'')+'">&#9888; '+escHtml(msg)+'</div>';
}

function renderHistorySection(list, status, detail){
  list = list || [];
  const banner = syncStatusBanner_(status, detail);
  if(list.length === 0){
    return '<div class="drawer-section-title">Previous audits</div>' + banner;
  }
  return '<div class="drawer-section-title">Previous audits</div>'
    + banner
    + '<div class="drawer-hint">Tap an audit to view its summary report.</div>'
    + list.map((h,i) => {
        const pct = h.score ? h.score.pct : 0;
        const goodBad = pct >= 80 ? 'good' : 'bad';
        return '<button class="history-item" onclick="openReport('+i+')">'
          + '<div class="h-main">'
          + '<div class="h-branch">'+(escHtml(h.branch)||'(no branch name)')+'</div>'
          + '<div class="h-date">'+escHtml(h.auditDate||'')+' &middot; submitted '+escHtml(fmtDate(h.submittedAt))+'</div>'
          + '</div>'
          + '<div class="h-score '+goodBad+'">'+pct+'%</div>'
          + '<span class="chev">&rsaquo;</span>'
          + '</button>';
      }).join('');
}

async function renderBranchDrawer(){
  const body = document.getElementById('branchDrawerBody');
  if(!body) return;
  // Show cached/local list right away (no blank flash), then refresh
  // with the shared server copy once it arrives — that refreshed copy
  // is what keeps phone and desktop in sync with each other. The
  // banner renderHistorySection adds now makes it obvious whenever
  // that refresh DIDN'T actually happen, instead of silently showing
  // old data that looks live but isn't.
  historyCache = historyCache || loadLocalHistory();
  body.innerHTML = renderHistorySection(historyCache, 'checking', null);
  const result = await fetchHistory();
  historyCache = result.list;
  body.innerHTML = renderHistorySection(historyCache, result.status, result.detail);
}

/* ---------- report viewer (read-only summary of a past audit) ---------- */
function buildReportHtml(h){
  const s = h.state || {};
  const score = h.score || computeScore(s);
  const pillYN = v => v===true ? '<span class="badge ok">Yes</span>' : v===false ? '<span class="badge del">No</span>' : '&mdash;';
  let html = '';
  html += '<div class="report-hero">'
    + '<div class="score-num">'+score.pct+'%</div>'
    + '<div class="score-meta">Checklist compliance<br><strong>'+score.yes+'</strong> yes &middot; <strong>'+score.no+'</strong> no &middot; '+score.total+' items scored</div>'
    + '</div>';
  html += '<div class="info-list">'
    + '<div class="info-row"><span>Branch</span><span>'+(escHtml(h.branch)||'&mdash;')+'</span></div>'
    + '<div class="info-row"><span>Auditor</span><span>'+(escHtml(h.auditor)||'&mdash;')+'</span></div>'
    + '<div class="info-row"><span>Audit date</span><span>'+(escHtml(h.auditDate)||'&mdash;')+'</span></div>'
    + '<div class="info-row"><span>Submitted</span><span>'+(escHtml(fmtDate(h.submittedAt))||'&mdash;')+'</span></div>'
    + (s.cash ? '<div class="info-row"><span>Net collection</span><span>'+(escHtml(s.cash.netCollection)||'&mdash;')+'</span></div>'
              + '<div class="info-row"><span>Cash on hand</span><span>'+(escHtml(s.cash.cashOnHand)||'&mdash;')+'</span></div>' : '')
    + '</div>';

  const depositRows = (s.cash && s.cash.deposits || []).filter(d => d && ((d.amount!=='' && d.amount!=null) || (d.time && String(d.time).trim()) || (d.remarks && String(d.remarks).trim())));
  if(depositRows.length){
    html += '<div class="report-section-title">Deposits</div>';
    html += depositRows.map(d =>
      '<div class="report-row"><div class="r-label">'+fmtMoney(parseFloat(d.amount)||0) + (d.time ? ' &middot; '+escHtml(d.time) : '')
        + (d.remarks ? '<div class="r-remark">'+escHtml(d.remarks)+'</div>' : '')
        + '</div></div>'
    ).join('');
    html += '<div class="report-row"><div class="r-label"><strong>Total</strong></div><span class="badge">'+fmtMoney(depositsTotal(s.cash.deposits))+'</span></div>';
  }

  html += '<div class="report-section-title">Checklist answers</div>';
  Object.keys(ynLabels).forEach(p=>{
    const v = getFrom(s,p);
    html += '<div class="report-row"><div class="r-label">'+ynLabels[p]+'</div>'+pillYN(v)+'</div>';
  });

  html += '<div class="report-section-title">Condition checks</div>';
  Object.keys(condLabels).forEach(p=>{
    const c = getFrom(s,p) || {};
    const cond = c.condition || '\u2014';
    const condOk = (cond==='Good'||cond==='Complete'), condBad = (cond==='Poor'||cond==='Incomplete');
    const hasCount = c.count !== '' && c.count != null && !isNaN(Number(c.count));
    html += '<div class="report-row"><div class="r-label">'+condLabels[p]
      + (hasCount ? '<div class="r-remark">Count: '+escHtml(c.count)+'</div>' : '')
      + (c.remarks ? '<div class="r-remark">'+escHtml(c.remarks)+'</div>' : '')
      + '</div><span class="badge '+(condOk?'ok':condBad?'del':'')+'">'+escHtml(cond)+'</span></div>';
  });
  Object.keys(statusLabels).forEach(p=>{
    const st = getFrom(s,p) || {};
    const status = st.status || '\u2014';
    const stOk = (status==='Complete'||status==='Good'), stBad = (status==='Missing'||status==='Poor');
    html += '<div class="report-row"><div class="r-label">'+statusLabels[p]
      + (st.remarks ? '<div class="r-remark">'+escHtml(st.remarks)+'</div>' : '')
      + '</div><span class="badge '+(stOk?'ok':stBad?'del':'')+'">'+escHtml(status)+'</span></div>';
  });

  html += '<div class="report-section-title">Findings</div>';
  if(s.findings && s.findings.length){
    html += s.findings.map((f,i)=>'<div class="finding-review-row"><span>#'+(i+1)+' ('+(f.severity||'Medium')+')</span><span>'+(escHtml(f.text||'')||'&mdash;')+'</span></div>').join('');
  } else {
    html += '<div class="empty-hint">None logged.</div>';
  }
  return html;
}

/* Edit/Delete buttons shown at the top of the report drawer for a
   past audit. Edit is disabled (with an explanatory title) when this
   device doesn't have the audit's full state cached locally. */
function reportActionsHtml(h){
  const canEdit = !!h.state;
  return '<div class="report-actions">'
    + '<button type="button" class="btn"'+(canEdit?' onclick="editAuditFromReport()"':' disabled title="Full data not available on this device"')+'>Edit</button>'
    + '<button type="button" class="btn danger" onclick="deleteAuditFromReport()">Delete</button>'
    + '</div>';
}

function openReport(idx){
  const list = historyCache || loadLocalHistory();
  const h = list[idx];
  if(!h) return;
  openReportIdx = idx;
  document.getElementById('reportTitle').textContent = h.branch || 'Audit report';
  document.getElementById('reportBody').innerHTML = reportActionsHtml(h) + buildReportHtml(h);
  document.getElementById('reportDrawer').classList.add('open');
  document.getElementById('reportOverlay').classList.add('open');
  document.getElementById('reportDrawer').setAttribute('aria-hidden','false');
}

function closeReport(){
  openReportIdx = -1;
  document.getElementById('reportDrawer').classList.remove('open');
  document.getElementById('reportOverlay').classList.remove('open');
  document.getElementById('reportDrawer').setAttribute('aria-hidden','true');
}

function selectBranch(name){
  set('branch', name);
  closeBranchMenu();
  render();
}

function openBranchMenu(){
  renderBranchDrawer();
  document.getElementById('branchDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('branchDrawer').setAttribute('aria-hidden','false');
}

function closeBranchMenu(){
  document.getElementById('branchDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('branchDrawer').setAttribute('aria-hidden','true');
}

/* ============================================================
   HARD RELOAD / RESET APP
   ------------------------------------------------------------
   For use after pushing an update to GitHub: clears any Cache
   Storage / service worker (in case one is ever added later),
   then force-navigates to a cache-busted URL so the browser
   can't serve a stale copy of this file on PC or mobile.
   Previous audit reports (HISTORY_KEY) are deliberately left
   alone so they aren't lost on reset.
   ============================================================ */
async function hardResetApp(){
  const btn = document.getElementById('hardResetBtn');
  if(!confirm('This reloads the latest version of the app from GitHub. Your previous audit reports on this device are kept. Continue?')) return;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Resetting\u2026'; }

  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}

  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  }catch(e){}

  const url = new URL(window.location.href);
  url.searchParams.set('_r', Date.now().toString());
  window.location.replace(url.toString());
}

/* Keep the space reserved above the fixed Submit bar in exact sync with
   its real rendered height, instead of a guessed pixel value — avoids
   a visible blank strip if the bar's height ever differs by device/font. */
function syncFooterHeight(){
  const el = document.querySelector('footer.nav-bar');
  if(!el) return;
  document.documentElement.style.setProperty('--footer-h', el.offsetHeight + 'px');
}
window.addEventListener('resize', syncFooterHeight);
window.addEventListener('orientationchange', syncFooterHeight);
if(window.ResizeObserver){
  new ResizeObserver(syncFooterHeight).observe(document.querySelector('footer.nav-bar'));
}
syncFooterHeight();

render();
loadBranches(true);
</script>
