<style>
  :root{
    --ink:#0D1230;
    --paper:#EEF1F9;
    --panel:#16215A;
    --panel-2:#0B1140;
    --panel-3:#243585;
    --line:#E2E6F3;
    --card:#FFFFFF;
    --text:#1B2140;
    --muted:#6B7290;
    --muted-2:#8B94B3;
    --accent:#2A3D9A;
    --accent-dark:#1D2C74;
    --accent-soft:#E7EAFA;
    --gold:#B8934A;
    --gold-soft:#F6EEDD;
    --ok:#1F7A5C;
    --ok-soft:#DEF2EA;
    --del:#B0304A;
    --del-soft:#F8E1E7;
    --rstr:#9C7A2E;
    --rstr-soft:#F1E7CE;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(16,22,60,.05), 0 3px 10px rgba(16,22,60,.06);
    --shadow-md:0 6px 20px rgba(16,22,60,.09);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
    font-family:'Inter',-apple-system,Arial,sans-serif;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }
  *{box-sizing:border-box; min-width:0;}
  html{-webkit-text-size-adjust:100%; background:var(--panel-2); overscroll-behavior-y:none;
    height:100vh; height:100dvh; overflow:hidden;}
  body{margin:0;background:var(--paper);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    overflow-wrap:anywhere; word-break:break-word;}
  /* The page used to rely on document-level scrolling, which — combined
     with the fixed footer and the mobile-web-app-capable/standalone meta
     tags above — is a known combo that breaks scrolling entirely in some
     mobile browsers and in-app webviews (and can misbehave on desktop
     too). #scrollArea below is now the ONE explicit scroll container;
     html/body themselves never scroll. This is the robust fix. */
  #scrollArea{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    padding-bottom:calc(var(--footer-h, 84px) + 10px + var(--safe-b));}
  img,svg{max-width:100%;}
  input,textarea,select,button{max-width:100%;}
  *{scrollbar-width:thin;scrollbar-color:#C7CEEE var(--line);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CEEE;border-radius:8px;}

  /* ---------- header ---------- */
  .app-toolbar{position:sticky; top:0; z-index:30;}
  .topband{
    background:
      radial-gradient(900px 200px at 10% -60%, rgba(90,110,220,.30), transparent 60%),
      linear-gradient(120deg, var(--panel-2) 0%, var(--panel) 55%, var(--panel-3) 100%);
    color:#EDEFF9; padding:calc(10px + var(--safe-t)) 10px 10px;
    box-shadow:0 2px 20px rgba(4,8,32,.35);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .topband-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:8px; transition:max-width .15s;}
  @media (min-width:860px){ .topband-inner{max-width:none;} .topband{padding-left:24px; padding-right:24px;} }
  @media (min-width:1440px){ .topband{padding-left:32px; padding-right:32px;} }
  .hdr-icon-btn{flex-shrink:0; width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent;}
  .hdr-icon-btn:active{background:rgba(255,255,255,.18);}
  .hdr-icon-btn svg{width:18px; height:18px; display:block;}
  .brand{flex:1; min-width:0; overflow:hidden;}
  .brand .mark{font-family:'Spectral',serif; font-weight:700; font-size:19px; letter-spacing:.6px; color:#fff; line-height:1.2;
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand .sub{font-size:12px; color:#B7C0E8; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hdr-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .hdr-chip{font-size:10.5px; font-weight:700; letter-spacing:.3px; padding:5px 10px; border-radius:20px;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); white-space:nowrap; color:#fff;}
  @media (max-width:360px){ .hdr-chip{display:none;} }

  /* ---------- branch drawer (hamburger menu) ---------- */
  .drawer-overlay{position:fixed; inset:0; background:rgba(10,14,40,.45); z-index:39;
    opacity:0; pointer-events:none; transition:opacity .2s;}
  .drawer-overlay.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(84vw,340px); background:#fff; z-index:40;
    box-shadow:-8px 0 30px rgba(10,14,40,.25); transform:translateX(100%); transition:transform .22s ease;
    display:flex; flex-direction:column; padding-top:var(--safe-t);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 16px 12px; border-bottom:1px solid var(--line);}
  .drawer-title{font-family:'Spectral',serif; font-weight:600; font-size:16px; color:var(--ink);}
  .drawer-close{border:none; background:#F1F3FB; color:var(--muted); width:30px; height:30px; border-radius:50%;
    font-size:16px; line-height:1; cursor:pointer;}
  .drawer-body{flex:1; overflow-y:auto; padding:10px 10px calc(16px + var(--safe-b));}
  .drawer-hint{font-size:11.5px; color:var(--muted); padding:2px 8px 10px;}
  .drawer-foot{flex-shrink:0; border-top:1px solid var(--line); padding:12px 12px calc(12px + var(--safe-b));}
  .drawer-reset-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border:1px solid #F0C3CE; background:var(--del-soft); color:var(--del); font-family:inherit;
    font-size:13px; font-weight:700; padding:11px 12px; border-radius:10px; cursor:pointer;}
  .drawer-reset-btn:active{background:#F3CBD5;}
  .drawer-reset-btn svg{width:15px; height:15px; flex-shrink:0;}
  .drawer-reset-hint{font-size:10.5px; color:var(--muted); text-align:center; margin-top:7px;}
  .branch-item{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:11px 12px; margin-bottom:8px; font-family:inherit; font-size:13px; color:var(--text);
    cursor:pointer;}
  .branch-item:active{background:var(--accent-soft); border-color:#C9D1EE;}
  .branch-item.current{background:var(--accent-soft); border-color:#C9D1EE; color:var(--accent-dark); font-weight:700;}
  .branch-item .chev{color:var(--muted-2); flex-shrink:0;}
  .branch-item .b-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .drawer-section-title{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.4px; padding:10px 8px 8px; margin-top:2px;}
  .drawer-section-title:first-child{margin-top:0;}
  .history-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:8px;
    font-family:inherit; cursor:pointer;}
  .history-item:active{background:var(--accent-soft); border-color:#C9D1EE;}
  .history-item .h-main{flex:1; min-width:0;}
  .history-item .h-branch{font-size:13px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-item .h-date{font-size:11px; color:var(--muted); margin-top:2px;}
  .history-item .h-score{flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    padding:4px 9px; border-radius:20px;}
  .history-item .h-score.good{background:var(--ok-soft); color:var(--ok);}
  .history-item .h-score.bad{background:var(--del-soft); color:var(--del);}
  .history-item .chev{color:var(--muted-2); flex-shrink:0;}

  .report-hero{display:flex; align-items:center; gap:14px; padding:14px; background:var(--accent-soft);
    border:1px solid #D6DBF6; border-radius:12px; margin-bottom:14px;}
  .report-section-title{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.4px; margin:16px 0 8px;}
  .report-section-title:first-of-type{margin-top:0;}
  .report-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:8px 10px;
    border:1px solid var(--line); border-radius:9px; margin-bottom:6px; background:#fff;}
  .report-row .r-label{flex:1; color:var(--text);}
  .report-row .r-remark{font-size:11px; color:var(--muted); margin-top:3px;}

  /* ---------- toolbar: search / print / share (replaces old jump-chip row) ---------- */
  .toolbar-row{display:flex; align-items:center; gap:8px; padding:10px 14px; background:#fff;
    border-bottom:1px solid var(--line); box-shadow:0 4px 10px rgba(16,22,60,.05);}
  .search-wrap{flex:1; min-width:0; display:flex; align-items:center; gap:6px;
    border:1px solid #D7DCF0; background:#F8F9FD; border-radius:999px; padding:0 6px 0 12px;}
  .search-wrap svg{flex-shrink:0; width:15px; height:15px; color:var(--muted-2);}
  .search-wrap input{flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:inherit; font-size:13px; color:var(--text); padding:8px 4px;}
  .search-wrap input::placeholder{color:var(--muted-2);}
  .search-count{flex-shrink:0; font-size:10.5px; font-weight:700; color:var(--muted); padding:0 4px; white-space:nowrap;}
  .search-clear{flex-shrink:0; border:none; background:transparent; color:var(--muted); width:24px; height:24px;
    border-radius:50%; font-size:15px; line-height:1; cursor:pointer;}
  .search-clear:active{background:var(--accent-soft);}
  .tb-icon-btn{flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#F8F9FD; color:var(--accent-dark); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;}
  .tb-icon-btn:active{background:var(--accent-soft);}
  .tb-icon-btn svg{width:16px; height:16px;}
  mark.search-hit{background:var(--gold-soft); color:inherit; border-radius:3px; padding:0 1px;}
  mark.search-hit.current{background:#F3D77A;}
  @media (min-width:860px){
    .toolbar-row{padding:12px 24px;}
    .search-wrap{max-width:520px; margin:0 auto 0 0;}
  }

  /* ---------- print ---------- */
  @media print{
    @page{ size:letter; margin:1in; }
    .app-toolbar, footer.nav-bar, .drawer-overlay, .drawer, .toast{display:none !important;}
    #scrollArea{overflow:visible !important; height:auto !important; padding-bottom:0 !important;}
    body{overflow:visible !important; height:auto !important; display:block !important;}
    .card{break-inside:avoid; box-shadow:none !important; border:1px solid #ccc !important;}
    #main{column-count:1 !important;}
    body.previewing #scrollArea, body.previewing footer.nav-bar{display:none !important;}
    body.previewing .preview-overlay{position:static !important; background:none !important;}
    body.previewing .preview-toolbar{display:none !important;}
    body.previewing .preview-page-wrap{padding:0 !important; overflow:visible !important; display:block !important;}
    body.previewing .preview-page{box-shadow:none !important; max-width:100% !important; width:auto !important; min-height:0 !important; padding:0 !important; border-radius:0 !important;}
  }

  /* ---------- full-screen report preview ---------- */
  .preview-overlay{position:fixed; inset:0; background:#4b5163; z-index:80; display:none; flex-direction:column;}
  .preview-overlay.open{display:flex;}
  .preview-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; background:#0f2547; color:#fff; flex-shrink:0;}
  .preview-title{font-weight:700; font-size:14px; letter-spacing:.2px;}
  .preview-hint{font-size:11px; font-weight:400; opacity:.75; display:block; margin-top:1px;}
  .preview-actions{display:flex; gap:8px; align-items:center;}
  .preview-btn{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff;
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .preview-btn.primary{background:#fff; color:#0f2547; border-color:#fff;}
  .preview-page-wrap{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    padding:26px 14px 60px; display:flex; justify-content:flex-start; align-items:flex-start; touch-action:pan-y;}
  .preview-page{background:#fff; width:100%; max-width:816px; min-height:1056px; padding:11.7647%;
    box-shadow:0 8px 28px rgba(0,0,0,.28); border-radius:2px; font-family:Calibri,'Segoe UI',Arial,sans-serif;
    color:#111; font-size:12pt; line-height:1.15; outline:none; flex-shrink:0; box-sizing:border-box;
    widows:3; orphans:3;}
  .preview-page:focus{box-shadow:0 8px 28px rgba(0,0,0,.28), 0 0 0 3px rgba(42,61,154,.3);}
  .pv-branch{font-weight:400; text-align:left; font-size:12pt;}
  .pv-title{font-weight:400; text-align:left; font-size:12pt;}
  .pv-date{text-align:left; font-size:12pt; margin-bottom:20px; break-after:avoid;}
  .pv-branch,.pv-title{break-inside:avoid; break-after:avoid;}
  /* Plain bold section labels (BRANCH / Field), no underline — matches
     the plain-document look of the reference report, not a styled
     divider. break-after/break-inside keep a heading from ever being
     stranded alone at the bottom of a printed page, separated from the
     list that follows it. */
  .pv-section{font-weight:700; margin:16px 0 2px;
    break-after:avoid; break-inside:avoid;}
  .pv-list{margin:0 0 4px; padding-left:34px;}
  /* break-inside:avoid on each item stops a single numbered finding from
     being split across two pages mid-sentence when printed. */
  .pv-list li{margin-bottom:2px; padding-left:2px; break-inside:avoid;}
  .pv-footer{margin-top:56px; width:100%; break-inside:avoid;}
  .pv-sign{display:inline-block; width:45%; vertical-align:top;}
  .pv-sign + .pv-sign{margin-left:8%;}
  .pv-sign-label{font-size:12pt;}
  .pv-sign .line{margin-top:44px; padding-top:4px; font-size:12pt; min-height:14px;}
  @media (max-width:640px){
    .preview-title{font-size:13px;}
    .preview-hint{display:none;}
    .preview-toolbar{padding:10px 10px; gap:6px; flex-wrap:nowrap;}
    .preview-actions{gap:6px;}
    .preview-btn{padding:7px 9px; font-size:12px;}
  }
  @media (max-width:380px){
    .preview-title{font-size:11.5px;}
    .preview-btn{padding:6px 7px; font-size:10.5px; border-radius:7px;}
    .preview-actions{gap:4px;}
  }


  /* ---------- layout ----------
     Mobile: everything is one narrow column (as before).
     >=860px: the container widens and cards flow into a masonry-style
     multi-column layout (CSS columns, not CSS grid) so cards of very
     different heights — a 6-row condition list next to a 3-field form —
     pack tightly instead of leaving a grid full of gaps. A handful of
     "lead" cards (branch/auditor, cash, findings, review) are marked
     .card-wide and span every column, since they read better full-width
     than squeezed into one column. */
  .wrap{max-width:640px; margin:0 auto; padding:16px 14px 8px; transition:max-width .15s;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
    break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;}

  @media (min-width:860px){
    .wrap{max-width:1120px; padding:24px 28px 12px;}
    #main{column-count:2; column-gap:20px;}
    .card-wide{column-span:all;}
  }
  @media (min-width:1440px){
    .wrap{max-width:1360px;}
    #main{column-count:3;}
  }
  .section-title{display:flex; align-items:center; gap:10px; margin:0 0 4px;}
  .section-title .st-text{font-family:'Spectral',serif; font-size:16.5px; font-weight:600; color:var(--ink);
    white-space:normal; overflow-wrap:anywhere; word-break:break-word; min-width:0;}
  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}
  .section-count{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--muted);
    background:#F1F3FB; border:1px solid var(--line); border-radius:20px; padding:2px 9px; flex-shrink:0;}
  .card-hint{font-size:12px; color:var(--muted); margin:4px 0 12px;}
  .card-body{margin-top:12px;}

  /* ---------- fields ---------- */
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 10px;}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field.span2{grid-column:1 / -1;}
  /* Wide cards (branch/auditor, cash, findings, review) span every
     masonry column so they read as full-width banners, but their actual
     content is capped to a comfortable reading/typing width and grows
     its field grid to fit — so a full-bleed card never turns into one
     giant stretched-out row of inputs on a big monitor. */
  .card-wide .card-body, .card-wide .card-hint{max-width:760px;}
  .card-wide .field-grid{grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));}
  .field label{font-size:11px; color:var(--muted); font-weight:600;}
  .input, select, .field input, .field select{
    width:100%; border:1px solid #D7DCF0; background:#F8F9FD; border-radius:9px; padding:9px 10px;
    font-size:13.5px; color:var(--text); outline:none; font-family:inherit; text-align:left;
    transition:border-color .15s, box-shadow .15s;
  }
  .input:focus, select:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(42,61,154,.12);}
  textarea{width:100%; border:1px solid #D7DCF0; background:#F8F9FD; border-radius:9px; padding:9px 10px;
    font-size:13.5px; font-family:inherit; color:var(--text); resize:vertical; min-height:64px; outline:none;
    transition:border-color .15s, box-shadow .15s;}
  .field .input.locked{background:var(--accent-soft); border-color:#C9D1EE; font-family:'JetBrains Mono',monospace;
    font-weight:700; color:var(--accent-dark);}

  /* ---------- yes/no question rows ---------- */
  .q-row{position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 12px 11px 15px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff;
    margin-bottom:8px;}
  .q-row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    border-radius:var(--radius-sm) 0 0 var(--radius-sm); background:var(--line); transition:background .15s;}
  .q-row.yn-yes::before{background:var(--ok);}
  .q-row.yn-no::before{background:var(--del);}
  .q-text{font-size:13px; line-height:1.4; color:var(--text); flex:1; min-width:0;}
  .yn-toggle{display:flex; gap:6px; flex-shrink:0;}
  .yn-btn{border:1px solid var(--line); background:#fff; color:var(--muted); font-family:inherit;
    font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:20px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;}
  .yn-btn.yes.active{background:var(--ok-soft); color:var(--ok); border-color:#B7E1CE;}
  .yn-btn.no.active{background:var(--del-soft); color:var(--del); border-color:#F0C3CE;}
  .remarks-inline{margin:-2px 0 8px; }
  .remarks-inline .input{font-size:12.5px;}

  /* ---------- condition rows (Good/Fair/Poor) ---------- */
  .cond-row{border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; margin-bottom:8px; background:#fff;}
  .cond-row .cond-label{font-size:13px; font-weight:600; color:var(--text); margin-bottom:9px;}
  .cond-label-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cond-label-row .cond-label{flex:1; min-width:0;}
  .cond-count{width:64px; flex-shrink:0; border:1px solid var(--line); background:#F8F9FD; border-radius:8px;
    font-family:inherit; font-size:12.5px; color:var(--text); padding:6px 8px; text-align:center;
    margin-bottom:9px; box-sizing:border-box;}
  .cond-count::placeholder{color:var(--muted-2);}
  .cond-seg{display:flex; gap:6px; margin-bottom:8px;}
  .cond-seg button{flex:1; border:1px solid var(--line); background:#F8F9FD; color:var(--muted);
    font-family:inherit; font-size:11.5px; font-weight:700; padding:7px 0; border-radius:8px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;}
  .cond-seg button.active.good{background:var(--ok-soft); color:var(--ok); border-color:#B7E1CE;}
  .cond-seg button.active.fair{background:var(--rstr-soft); color:var(--rstr); border-color:#E6D6A0;}
  .cond-seg button.active.poor{background:var(--del-soft); color:var(--del); border-color:#F0C3CE;}
  .cond-seg button.active.complete{background:var(--ok-soft); color:var(--ok); border-color:#B7E1CE;}
  .cond-seg button.active.missing{background:var(--del-soft); color:var(--del); border-color:#F0C3CE;}
  .cond-seg button.active.incomplete{background:var(--del-soft); color:var(--del); border-color:#F0C3CE;}
  .status-row{border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; margin-bottom:8px; background:#fff;}
  .status-row .status-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px;}
  .status-row .status-head .cond-label{margin-bottom:0;}


  /* ---------- repeatable entry rows ---------- */
  .entry-row{display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px; margin-bottom:8px; background:#fff;}
  .entry-row .input{flex:1; min-width:0;}
  .entry-row-typed{display:grid; grid-template-columns:1.2fr 1fr auto; grid-template-areas:"type series remove" "remarks remarks remove";
    gap:6px 7px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:7px; margin-bottom:8px; background:#fff;}
  .entry-row-typed .input{min-width:0; padding:6px 7px; font-size:11.5px; box-sizing:border-box; width:100%;}
  .entry-row-typed .er-type{grid-area:type; display:flex; flex-direction:column; gap:5px; min-width:0;}
  .entry-row-typed .er-type-select{width:100%;}
  .entry-row-typed .er-series{grid-area:series;}
  .entry-row-typed .er-remarks{grid-area:remarks;}
  .entry-row-typed .icon-btn{grid-area:remove; align-self:center; width:28px; height:28px;}
  .icon-btn{border:1px solid #D9DDF0; background:#fff; border-radius:8px; width:32px; height:32px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--del); font-size:16px; line-height:1;}
  .icon-btn:active{background:var(--del-soft);}
  .btn-add{width:100%; border:1.5px dashed #C3CAE6; background:#F8F9FD; color:var(--accent-dark);
    border-radius:var(--radius-sm); padding:10px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer;}

  /* ---------- minimalist entry rows (Official Receipt / SI / DR groups) ----------
     Stacked instead of squeezed into a grid: a slim header (type picker or a plain
     index label, plus the delete button) on top, then Series No and Remarks each
     get their own full-width row so neither field's text is ever clipped. */
  .entry-row-simple{border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; margin-bottom:8px; background:#fff;}
  .entry-row-simple .er-row-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .entry-row-simple .er-type-select{flex:1; min-width:0; padding:7px 8px; font-size:12px; border:1px solid #D9DDF0;
    border-radius:8px; background:#fff; font-family:inherit; color:var(--text);}
  .entry-row-simple .er-row-head .icon-btn{width:28px; height:28px; flex-shrink:0;}
  .entry-row-simple .input{width:100%; box-sizing:border-box; padding:8px 9px; font-size:12.5px; margin-top:6px;}
  .er-row-index{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .or-group-title{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;
    margin:14px 0 8px;}
  .or-group-title:first-child{margin-top:0;}

  /* ---------- findings card header ---------- */
  .finding-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}

  /* ---------- report drawer actions (edit / delete a submitted audit) ---------- */
  .report-actions{display:flex; gap:8px; margin-bottom:14px;}
  .report-actions .btn{flex:1; text-align:center; padding:9px 10px; font-size:12.5px;}
  .report-actions .btn.danger{color:var(--del); border-color:#F0C3CE; background:var(--del-soft);}

  /* ---------- pair (confirmation sampling) cards ---------- */
  .pair-card{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#F8F9FD;}
  .pair-card-head{display:flex; gap:8px; margin-bottom:10px;}
  .pair-card-head .input{flex:1; background:#fff;}
  .pair-sub{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:2px 0 10px;}

  /* ---------- cash denomination breakdown ---------- */
  .denom-details{border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; background:#fff;}
  .denom-details[open] .denom-summary{border-bottom:1px solid var(--line);}
  .denom-summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:11px 12px; background:#F8F9FD; font-size:12.5px; font-weight:700; color:var(--text);
    -webkit-tap-highlight-color:transparent;}
  .denom-summary::-webkit-details-marker{display:none;}
  .denom-summary .ds-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .denom-summary .ds-total{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:800; color:var(--accent-dark);}
  .denom-summary .ds-chev{color:var(--muted-2); transition:transform .15s; flex-shrink:0;}
  .denom-details[open] .denom-summary .ds-chev{transform:rotate(180deg);}
  .denom-details .denom-table{border:none; border-radius:0;}
  .denom-table{border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; background:#fff;}
  .denom-head{display:grid; grid-template-columns:1fr 78px 92px; gap:8px; padding:7px 10px; background:#F1F3FB;
    font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
  .denom-row{display:grid; grid-template-columns:1fr 78px 92px; gap:8px; align-items:center; padding:6px 10px;
    border-top:1px solid var(--line);}
  .denom-row .denom-label{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--text); font-size:12.5px;}
  .denom-row .input{padding:6px 7px; font-size:13px; text-align:left;}
  .denom-sub{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); text-align:right; padding-right:2px;}
  .denom-total{display:grid; grid-template-columns:1fr 78px 92px; gap:8px; align-items:center; padding:8px 10px;
    border-top:1.5px solid var(--accent); background:var(--accent-soft);}
  .denom-total .denom-label{font-size:12px; font-weight:700; color:var(--accent-dark);}
  .denom-total .denom-sub{font-size:13px; font-weight:800; color:var(--accent-dark);}
  /* ---------- deposits: compact, minimalist single-line rows ---------- */
  .deposit-list{display:flex; flex-direction:column; gap:5px; margin-bottom:4px;}
  .deposit-row{display:flex; align-items:center; gap:5px;}
  .deposit-row .dep-amt, .deposit-row .dep-time, .deposit-row .dep-remarks{
    border:1px solid #D7DCF0; background:#F8F9FD; border-radius:7px; font-family:inherit;
    color:var(--text); outline:none; padding:5px 7px; font-size:12px; min-width:0;}
  .deposit-row .dep-amt{width:84px; flex:0 0 84px; text-align:left;}
  .deposit-row .dep-time{width:98px; flex:0 0 98px;}
  .deposit-row .dep-remarks{flex:1;}
  .deposit-row .dep-amt:focus, .deposit-row .dep-time:focus, .deposit-row .dep-remarks:focus{border-color:var(--accent); box-shadow:0 0 0 2px rgba(42,61,154,.10);}
  .deposit-row .dep-remove{flex-shrink:0; border:none; background:transparent; color:var(--muted-2);
    width:20px; height:20px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer; padding:0;}
  .deposit-row .dep-remove:active{background:var(--del-soft); color:var(--del);}
  .deposit-add{border:none; background:transparent; color:var(--accent-dark); font-family:inherit;
    font-size:11.5px; font-weight:700; padding:2px; cursor:pointer;}
  .deposit-add:active{text-decoration:underline;}
  @media (max-width:380px){
    .deposit-row .dep-amt{width:64px; flex:0 0 64px;}
    .deposit-row .dep-time{width:78px; flex:0 0 78px;}
  }

  /* ---------- findings ---------- */
  .finding-card{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;}
  .finding-foot{display:flex; gap:8px; margin-top:8px;}
  .sev-seg{display:flex; gap:6px; flex:1;}
  .sev-seg button{flex:1; border:1px solid var(--line); background:#F8F9FD; color:var(--muted); font-family:inherit;
    font-size:11px; font-weight:700; padding:7px 0; border-radius:8px; cursor:pointer;}
  .sev-seg button.active.low{background:var(--ok-soft); color:var(--ok); border-color:#B7E1CE;}
  .sev-seg button.active.medium{background:var(--rstr-soft); color:var(--rstr); border-color:#E6D6A0;}
  .sev-seg button.active.high{background:var(--del-soft); color:var(--del); border-color:#F0C3CE;}
  .empty-hint{color:var(--muted-2); font-size:12.5px; padding:10px 2px;}

  /* ---------- review / score card ---------- */
  .score-hero{display:flex; align-items:center; gap:16px; padding:14px; background:var(--accent-soft);
    border:1px solid #D6DBF6; border-radius:12px; margin-bottom:14px;}
  .score-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:34px; color:var(--accent-dark); line-height:1;}
  .score-meta{font-size:12px; color:var(--muted);}
  .score-meta strong{color:var(--text);}
  .badge{display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700;}
  .badge.ok{background:var(--ok-soft); color:var(--ok);}
  .badge.del{background:var(--del-soft); color:var(--del);}
  .info-list{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; margin-bottom:12px;}
  .info-row{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; font-size:12.5px;
    border-bottom:1px solid var(--line);}
  .info-row:last-child{border-bottom:none;}
  .info-row span:first-child{color:var(--muted);}
  .info-row span:last-child{font-weight:600; color:var(--text); text-align:right; max-width:60%; overflow-wrap:anywhere;}
  .review-sub{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:0 0 8px;}
  .finding-review-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0;
    border-bottom:1px dashed var(--line);}
  .finding-review-row:last-child{border-bottom:none;}
  .banner{background:var(--gold-soft); border:1px solid #E6D6A0; color:#6B5215; font-size:12.5px;
    padding:10px 14px; border-radius:10px; margin-bottom:10px;}

  /* ---------- footer / submit ---------- */
  footer.nav-bar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff;
    border-top:1px solid var(--line); padding:9px calc(14px + var(--safe-r)) calc(9px + var(--safe-b)) calc(14px + var(--safe-l));
    box-shadow:0 -8px 24px rgba(16,22,60,.08);
    transform:translateZ(0); -webkit-transform:translateZ(0); will-change:transform; backface-visibility:hidden;}
  .nav-bar-inner{max-width:520px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  .footer-status{display:none; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .footer-status strong{color:var(--text); font-family:'JetBrains Mono',monospace;}
  @media (min-width:860px){
    .nav-bar-inner{max-width:1120px;}
    .footer-status{display:block; flex:1;}
    .btn.primary{flex:0 0 auto; min-width:240px;}
  }
  .draft-note{font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0;}
  .btn{border:none; border-radius:9px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
    font-family:inherit; color:var(--text); background:#fff; border:1px solid #D7DCF0;}
  .btn.primary{flex:1; padding:10px 12px; font-size:13.5px; text-align:center; max-width:360px; margin:0 auto;
    background:linear-gradient(160deg,var(--accent),var(--accent-dark)); color:#fff; border:none;
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 3px 10px rgba(29,44,116,.28);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn.primary:disabled{opacity:.6; cursor:not-allowed;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:50;
    background:var(--panel-2); color:#fff; font-size:12.5px; padding:10px 16px; border-radius:10px; max-width:88vw;
    box-shadow:0 8px 24px rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s;}
  .toast.show{opacity:1; bottom:98px;}

  .spinner{width:15px; height:15px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:spin .7s linear infinite; flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:420px){
    .field-grid{grid-template-columns:1fr;}
    .field{grid-column:1 / -1;}
  }
</style>
</head>

<script>
/* ============================================================
   BACKEND CONFIG
   ------------------------------------------------------------
   Paste the Web app URL you get from Apps Script → Deploy → New
   deployment → Web app here. It looks like:
   https://script.google.com/macros/s/AKfycb.../exec
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtY9qnh6IpUOKRAj-KAwcvfXqVMOfi4u85ouZEdwmvMLJHvy1EUgzWaH1bBIpXeYIuvQ/exec';
const backendConfigured = APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_YOUR') !== 0;

/* ============================================================
   STATE
   ============================================================ */
const emptyEntry = () => ({ type:'', seriesNo:'', remarks:'' });
const emptyDepositEntry = () => ({ amount:'', time:'', remarks:'' });
const emptyStatusEntry = () => ({ status:'', remarks:'' });

function freshState(){
  return {
    branch:'', auditor:'', auditDate: new Date().toISOString().slice(0,10),
    cash:{ dateOfDailyReport:'', timePrintedReport:'',
      cashCount:{ d1000:'', d500:'', d200:'', d100:'', d50:'', d20:'', d10:'', d5:'', d1:'' },
      changeFund:{ d1000:'', d500:'', d200:'', d100:'', d50:'', d20:'', d10:'', d5:'', d1:'' },
      totalCollection:'', gcashCollection:'', lessExpenses:'', netCollection:'',
      deposits:[ emptyDepositEntry() ], cashOnHand:'' },
    reportsAttachments:{ depositSlipReconciled:null, dailyPerfReconciled:null,
      attachmentsComplete:null, vouchersSigned:null, last7DaysFiled:null },
    fieldCollection:{ picturesOnTime:null, copiesMonitored:null, whiteCopiesArranged:null },
    notebooks:{ cashReceiptJournal:null, salesJournal:null, registrationNotebook:null,
      closedAccountNotebook:null, noPendingChattel:null },
    officialReceipts:{ allComplete:null, cutoffSigned:null, greenCopiesFiledSeries:null,
      greenCopiesOrganized:null, properlyValidated:null,
      orEntries:[], sparepartsEntries:[], salesDrEntries:[], stockEntries:[],
      tableRemarks:'' },
    image:{
      openedBefore8am:null, personnelPresent:null,
      cleanliness:{condition:'',remarks:''}, grooming:{condition:'',remarks:''},
      idUniforms:{condition:'',remarks:''}, signages:{condition:'',remarks:''},
      branchKey:{condition:'',remarks:''}, branchVaultKey:{condition:'',remarks:''},
      branchConcerns:''
    },
    inventory:{
      oil:{condition:'',remarks:''}, promo:{condition:'',remarks:''},
      repoUnits:{condition:'',remarks:'',count:''}, serviceUnits:{condition:'',remarks:'',count:''},
      repairUnits:{condition:'',remarks:'',count:''},
      brandNewCondition:{condition:'',remarks:'',count:''},
      tools: emptyStatusEntry(), spareparts: emptyStatusEntry(),
      platesOrCr: emptyStatusEntry(), assets: emptyStatusEntry()
    },
    confirmation:{ remarks:'' },
    findings:[]
  };
}

let state = freshState();
let submitting = false;
/* Non-null while the form is editing a previously-submitted audit
   (holds that audit's submissionId) instead of drafting a brand-new
   one. Submit becomes "Save changes" and updates the existing sheet
   tab/index row in place rather than creating a new one. */
let editingSubmissionId = null;
/* Index into historyCache of whichever audit is currently open in the
   report drawer, so the Edit/Delete buttons there know what to act on. */
let openReportIdx = -1;

/* The "Audit Findings" preview is a STANDALONE document: it never
   writes back into `state`, so editing it can't change your checklist
   answers or score, and the main history/dashboard list still reflects
   the checklist you actually filled in. But YOUR edited wording (not
   the raw auto-draft) is what gets saved as the narrative on Submit —
   see doSubmit(). It's auto-drafted fresh the first time you open the
   preview for a given audit, kept as-is across re-opens/edits within
   that audit, and reset to null (so a fresh auto-draft appears) when
   you start a brand-new audit. When you tap Edit on a past audit,
   this is restored from that audit's saved reportNarrativeHtml (if
   any) instead of being reset — so re-opening the preview shows
   exactly what you left it as last time, on that exact branch. */
let previewEditedHtml = null;

/* search state (toolbar below header) */
let searchQuery = '';
let searchMatches = [];
let searchIndex = -1;

/* ============================================================
   PERSISTENCE (previous submitted audits)
   ------------------------------------------------------------
   "Previous audits" now comes from the shared Google Sheet (via
   ?action=history on the Apps Script backend) so every device sees
   the SAME list. localStorage is kept only as an offline fallback/
   cache — it is no longer the source of truth, which is what used
   to make phone and desktop disagree.
   ============================================================ */
const HISTORY_KEY = 'branchAuditHistory_v1';
let historyCache = null; // last list actually shown (server, or local fallback)

function loadLocalHistory(){
  try{ const raw = localStorage.getItem(HISTORY_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLocalHistoryCache(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){}
}
/* Optimistic local echo right after this device submits, so the
   audit just sent shows up immediately even before the next server
   fetch completes. It gets replaced by the server's copy on the next
   successful fetchHistory() call. */
function saveHistoryEntry(entry){
  try{
    const list = loadLocalHistory();
    list.unshift(entry);
    if(list.length > 30) list.length = 30;
    saveLocalHistoryCache(list);
  }catch(e){}
}
/* Fetches the shared history from the backend. Falls back to whatever
   was last cached locally if offline or the backend isn't configured.
   Returns { list, status, detail } instead of just the list, so the
   drawer can tell the person plainly whether they're looking at a
   live sync or a stale local fallback — instead of silently showing
   old data with no indication anything went wrong. */
async function fetchHistory(){
  if(!backendConfigured) return { list: loadLocalHistory(), status:'unconfigured', detail:'Backend not configured.' };
  try{
    // cache:'no-store' + a timestamp param stop the browser (and any
    // network cache in between) from serving back a stale response for
    // what looks like "the same" GET URL — without this, a device can
    // sit showing old history for a while after a new audit was submitted
    // elsewhere.
    const res = await fetch(APPS_SCRIPT_URL + '?action=history&_=' + Date.now(), { cache: 'no-store' });
    if(!res.ok){
      return { list: loadLocalHistory(), status:'error', detail:'Server responded with HTTP '+res.status+' — the backend URL may be wrong, or the deployment needs republishing.' };
    }
    const result = await res.json();
    if(result && Array.isArray(result.history)){
      saveLocalHistoryCache(result.history);
      return { list: result.history, status:'live', detail:null };
    }
    // The server answered but with no "history" array at all — the
    // classic sign the deployed Apps Script code is an OLDER version
    // that doesn't know the "history" action yet (edit → Deploy →
    // "New version" was never run after the last update).
    return { list: loadLocalHistory(), status:'stale-backend', detail:'The server responded, but without audit history — the deployed Apps Script code looks out of date. Re-deploy Code.gs as a "New version".' };
  }catch(e){
    return { list: loadLocalHistory(), status:'error', detail:'Could not reach the server: '+(e && e.message ? e.message : e) };
  }
}

/* ============================================================
   HELPERS — data
   ============================================================ */
function get(path){
  return path.split('.').reduce((o,k)=> (o==null?o:o[k]), state);
}
function set(path, value){
  const keys = path.split('.');
  let o = state;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = value;
}
function escAttr(s){ return (s==null?'':String(s)).replace(/"/g,'&quot;'); }
function escHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function setYN(path, val){
  const cur=get(path); set(path, cur===val?null:val);
  renderSection(sectionIdForPath(path));
  refreshSummary();
}
function setCond(path, val){
  const cur = get(path+'.condition');
  set(path+'.condition', cur===val ? '' : val);
  renderSection(sectionIdForPath(path));
}
function setRepField(path, idx, field, val){ get(path)[idx][field] = val; }
function addRep(path){ get(path).push(emptyEntry()); renderSection(sectionIdForPath(path)); }
function removeRep(path, idx){
  const row = get(path)[idx] || {};
  const hasData = (row.seriesNo && String(row.seriesNo).trim()) || (row.remarks && String(row.remarks).trim());
  if(hasData && !confirm('Remove this entry? The series no. and remarks you entered for it will be deleted.')) return;
  get(path).splice(idx,1);
  renderSection(sectionIdForPath(path));
}

/* ---------- cash: denomination breakdown + live totals ----------
   These run on every keystroke (oninput). They must NEVER call the
   full render() — replacing the whole form's HTML while a number
   field is focused is exactly what was kicking the on-screen
   keyboard closed after every digit. Instead they patch only the
   handful of read-only totals that actually changed, straight
   through the DOM, so the field you're typing in is never touched. */
const CASH_DENOMS = [1000,500,200,100,50,20,10,5,1];
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function denomGroupTotal(group){
  let total = 0;
  CASH_DENOMS.forEach(d => { total += (parseFloat(group['d'+d])||0) * d; });
  return total;
}
function onDenomInput(group, denom, el){
  state.cash[group]['d'+denom] = el.value;
  const qty = parseFloat(el.value)||0;
  const sub = document.getElementById('denom-'+group+'-'+denom+'-sub');
  if(sub) sub.textContent = fmtMoney(qty*denom);
  const totalEl = document.getElementById('denom-'+group+'-total');
  if(totalEl) totalEl.textContent = fmtMoney(denomGroupTotal(state.cash[group]));
  const summaryTotalEl = document.getElementById('denom-'+group+'-total-summary');
  if(summaryTotalEl) summaryTotalEl.textContent = fmtMoney(denomGroupTotal(state.cash[group]));
  refreshCashComputed();
}
function onCashFieldInput(field, val){
  state.cash[field] = val;
  refreshCashComputed();
}
function depositsTotal(list){
  return (list||[]).reduce((sum,row)=> sum + (parseFloat(row.amount)||0), 0);
}
function setDepositField(idx, field, val){ state.cash.deposits[idx][field] = val; if(field==='amount') refreshCashComputed(); }
function addDeposit(){ state.cash.deposits.push(emptyDepositEntry()); renderSection('sec-cash'); refreshCashComputed(); }
function removeDeposit(idx){
  state.cash.deposits.splice(idx,1);
  if(state.cash.deposits.length===0) state.cash.deposits.push(emptyDepositEntry());
  renderSection('sec-cash'); refreshCashComputed();
}
function refreshCashComputed(){
  const c = state.cash;
  const n = v => parseFloat(v)||0;
  const total = n(c.totalCollection), gcash = n(c.gcashCollection),
        exp = n(c.lessExpenses), dep = depositsTotal(c.deposits);
  const net = total + gcash - exp;
  const onHand = net - dep;
  const hasInput = c.totalCollection !== '' || c.gcashCollection !== '' || c.lessExpenses !== '' || dep !== 0;
  c.netCollection = hasInput ? net.toFixed(2) : '';
  c.cashOnHand = hasInput ? onHand.toFixed(2) : '';

  const netEl = document.getElementById('cashNetDisplay');
  if(netEl) netEl.value = c.netCollection;
  const onHandEl = document.getElementById('cashOnHandDisplay');
  if(onHandEl) onHandEl.value = c.cashOnHand;
}

/* ============================================================
   SCORE
   ============================================================ */
const ynPaths = [
  'image.openedBefore8am','image.personnelPresent',
  'reportsAttachments.depositSlipReconciled','reportsAttachments.dailyPerfReconciled',
  'reportsAttachments.attachmentsComplete','reportsAttachments.vouchersSigned','reportsAttachments.last7DaysFiled',
  'fieldCollection.picturesOnTime','fieldCollection.copiesMonitored','fieldCollection.whiteCopiesArranged',
  'notebooks.cashReceiptJournal','notebooks.salesJournal','notebooks.registrationNotebook',
  'notebooks.closedAccountNotebook','notebooks.noPendingChattel',
  'officialReceipts.allComplete','officialReceipts.cutoffSigned',
  'officialReceipts.greenCopiesFiledSeries','officialReceipts.greenCopiesOrganized','officialReceipts.properlyValidated'
];
function getFrom(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj);
}
function computeScore(fromState){
  const s = fromState || state;
  let yes=0, no=0;
  ynPaths.forEach(p=>{ const v=getFrom(s,p); if(v===true) yes++; else if(v===false) no++; });
  const total = yes+no;
  const pct = total ? Math.round((yes/total)*100) : 0;
  return { total, yes, no, pct };
}
/* human-readable labels for the yes/no + condition checklist items,
   used to build the readable "previous audits" report */
const ynLabels = {
  'image.openedBefore8am':'Branch opened before 8:00 AM?',
  'image.personnelPresent':'All personnel were present on the day of the audit?',
  'reportsAttachments.depositSlipReconciled':'Deposit slips reconciled to the report?',
  'reportsAttachments.dailyPerfReconciled':'Daily performance reconciled to the collection report?',
  'reportsAttachments.attachmentsComplete':'All attachments of the reports complete?',
  'reportsAttachments.vouchersSigned':'All cash vouchers signed by designated personnel?',
  'reportsAttachments.last7DaysFiled':'Last 7 days of transactions filed with complete attachments?',
  'fieldCollection.picturesOnTime':'Collectors submitting field collection pictures on time?',
  'fieldCollection.copiesMonitored':'Field picture copies monitored by the cashier properly?',
  'fieldCollection.whiteCopiesArranged':'White copies of online-payment receipts properly arranged & monitored?',
  'notebooks.cashReceiptJournal':'Cash receipt journal updated?',
  'notebooks.salesJournal':'Sales journal updated?',
  'notebooks.registrationNotebook':'Registration / plate notebook updated?',
  'notebooks.closedAccountNotebook':'Closed account notebook updated?',
  'notebooks.noPendingChattel':'Branch is without pending chattel documents?',
  'officialReceipts.allComplete':'All official receipts complete (per OR monitoring)?',
  'officialReceipts.cutoffSigned':'Collectors\u2019 receipts found with a cut-off signature by the cashier?',
  'officialReceipts.greenCopiesFiledSeries':'Green copies of used OR / SI / DR filed in series?',
  'officialReceipts.greenCopiesOrganized':'Green copies filed & organized?',
  'officialReceipts.properlyValidated':'Official receipts are properly used and validated?'
};
const condLabels = {
  'image.cleanliness':'Cleanliness', 'image.grooming':'Grooming', 'image.idUniforms':'I.D. & uniforms',

/* Tools/Spareparts/Plates & OR-CR/Assets use a { status, remarks } shape
   (STATUS_OPTS: Complete/Missing/Good/Poor), not { condition, remarks }
   like the rows above — they need their own label map + their own
   ok/bad badge rule so the report shows their actual rating instead of
   silently dropping them or mis-coloring "Missing". */
const statusLabels = {
  'inventory.tools':'Tools (owned by company)',
  'inventory.spareparts':'Spareparts (3S shop only)',
  'inventory.platesOrCr':'Plates and OR-CR',
  'inventory.assets':'Assets'
};
function sectionYNStats(paths){
  let answered=0;
  paths.forEach(p=>{ if(get(p)!==null) answered++; });
  return answered+'/'+paths.length;
}

/* ============================================================
   MARKUP BUILDERS
   ============================================================ */
function card(id, title, hint, countLabel, innerHtml, wide){
  return '<section class="card'+(wide?' card-wide':'')+'" id="'+id+'">'
    + '<div class="section-title"><span class="st-text">'+title+'</span>'
    + (countLabel ? '<span class="section-count">'+countLabel+'</span>' : '')
    + '</div>'
    + (hint ? '<p class="card-hint">'+hint+'</p>' : '')
    + '<div class="card-body">'+innerHtml+'</div>'
    + '</section>';
}

function field(label, innerHtml, span2){
  return '<div class="field'+(span2?' span2':'')+'"><label>'+label+'</label>'+innerHtml+'</div>';
}
function inputEl(value, onAttr, type, extra, locked){
  type = type || 'text'; extra = extra || '';
  return '<input class="input'+(locked?' locked':'')+'" type="'+type+'" '+extra+' value="'+escAttr(value)+'" '+onAttr+(locked?' disabled':'')+'>';
}
function textareaEl(value, onAttr, placeholder){
  return '<textarea placeholder="'+escAttr(placeholder||'')+'" '+onAttr+'>'+escHtml(value)+'</textarea>';
}

function ynRow(path, label){
  const v = get(path);
  const cls = v===true ? 'yn-yes' : v===false ? 'yn-no' : '';
  return '<div class="q-row '+cls+'">'
    + '<div class="q-text">'+label+'</div>'
    + '<div class="yn-toggle">'
    + '<button type="button" class="yn-btn yes '+(v===true?'active':'')+'" onclick="setYN(\''+path+'\',true)">Yes</button>'
    + '<button type="button" class="yn-btn no '+(v===false?'active':'')+'" onclick="setYN(\''+path+'\',false)">No</button>'
    + '</div></div>';
}
function remarksInline(path, placeholder){
  return '<div class="remarks-inline">'+inputEl(get(path), 'oninput="set(\''+path+'\', this.value)"', 'text', 'placeholder="'+escAttr(placeholder||'Remarks (optional)')+'"')+'</div>';
}

function conditionRow(path, label, opts, withCount){
  opts = opts || ['Good','Fair','Poor'];
  const v = get(path+'.condition');
  const r = get(path+'.remarks');
  const seg = opts.map(function(o){
    return '<button type="button" class="'+(v===o?'active '+o.toLowerCase():'')+'" onclick="setCond(\''+path+'\',\''+o+'\')">'+o+'</button>';
  }).join('');
  const countHtml = withCount
    ? '<input class="cond-count" type="number" inputmode="numeric" min="0" placeholder="Count" value="'
      + escAttr(get(path+'.count')) + '" oninput="set(\''+path+'.count\', this.value)">'
    : '';
  return '<div class="cond-row">'
    + '<div class="cond-label-row"><div class="cond-label">'+label+'</div>'+countHtml+'</div>'
    + '<div class="cond-seg">'+seg+'</div>'
    + inputEl(r, 'oninput="set(\''+path+'.remarks\', this.value)"', 'text', 'placeholder="Remarks (optional)"')
    + '</div>';
}

/* Official Receipt / SI / DR entries used to be one flat list with a
   10-option "Used/Stock - <doc type>" dropdown crammed next to Series
   No in a tight grid — hard to read and easy to squeeze on a phone.
   They're now four separate, clearly headered groups (Official
   Receipt, Spareparts Invoice, Sales Invoice & Delivery Receipt,
   Stock Receipt), each its own repeatable list, so nothing has to
   share a row with a dropdown it doesn't need. Series No and Remarks
   each get their own full-width line so long values (e.g. a series
   range like "10050 - 10051") are always fully visible, not clipped. */
const OR_GROUPS = [
  { path:'officialReceipts.orEntries', title:'Official Receipt', addLabel:'OR entry', presets:['Motofinance','Motowheels'] },
  { path:'officialReceipts.sparepartsEntries', title:'Spareparts Invoice', addLabel:'spareparts invoice', presets:null },
  { path:'officialReceipts.salesDrEntries', title:'Sales Invoice & Delivery Receipt', addLabel:'entry', presets:['Sales Invoice','Delivery Receipt'] },
  { path:'officialReceipts.stockEntries', title:'Stock Receipt', addLabel:'stock entry', presets:['Motofinance','Motowheels','Spareparts','Sales Invoice','Delivery Receipt'] }
];
function orEntryRow(path, row, i, presets){
  const head = presets
    ? '<select class="er-type-select" onchange="setRepField(\''+path+'\','+i+',\'type\',this.value)">'
      + '<option value=""'+(row.type?'':' selected')+'>Select type&hellip;</option>'
      + presets.map(t=>'<option value="'+escAttr(t)+'"'+(row.type===t?' selected':'')+'>'+escHtml(t)+'</option>').join('')
      + '</select>'
    : '<span class="er-row-index">Entry '+(i+1)+'</span>';
  return '<div class="entry-row-simple">'
    + '<div class="er-row-head">' + head
    + '<button type="button" class="icon-btn" onclick="removeRep(\''+path+'\','+i+')">&times;</button>'
    + '</div>'
    + '<input class="input" type="text" placeholder="Series No (e.g. 10050 - 10051)" value="'+escAttr(row.seriesNo)+'"'
    + ' oninput="setRepField(\''+path+'\','+i+',\'seriesNo\',this.value)">'
    + '<input class="input" type="text" placeholder="Remarks (optional)" value="'+escAttr(row.remarks)+'"'
    + ' oninput="setRepField(\''+path+'\','+i+',\'remarks\',this.value)">'
    + '</div>';
}
function orGroupList(g){
  const arr = get(g.path);
  let html = '<div class="or-group-title">'+escHtml(g.title)+'</div>';
  if(!arr.length){
    html += '<div class="empty-hint">No entries logged yet.</div>';
  } else {
    arr.forEach((row,i)=>{ html += orEntryRow(g.path, row, i, g.presets); });
  }
  html += '<button type="button" class="btn-add" onclick="addRep(\''+g.path+'\')">+ Add '+g.addLabel+'</button>';
  return html;
}

const STATUS_OPTS = ['Complete','Missing','Good','Poor'];
/** Single overall Status + Remarks row (no repeatable/numbered entries) —
 *  used for Tools, Spareparts, Plates & OR-CR, and Assets. Just log the
 *  remarks if there's a finding; otherwise leave remarks blank. */
function setStatusField(path, val){
  const cur = get(path+'.status');
  set(path+'.status', cur===val ? '' : val);
  renderSection(sectionIdForPath(path));
}
function statusRow(path){
  const row = get(path) || {status:'',remarks:''};
  return '<div class="status-row">'
    + '<div class="cond-seg">' + STATUS_OPTS.map(opt =>
        '<button type="button" class="'+(row.status===opt?'active '+opt.toLowerCase():'')+'" onclick="setStatusField(\''+path+'\',\''+opt+'\')">'+opt+'</button>'
      ).join('') + '</div>'
    + inputEl(row.remarks, 'oninput="set(\''+path+'.remarks\', this.value)"', 'text', 'placeholder="Remarks \u2014 only if there\u2019s a finding"')
    + '</div>';
}

function addFinding(){ state.findings.push({text:'', severity:'Medium'}); renderSection('sec-findings'); refreshSummary(); }
function removeFinding(i){ state.findings.splice(i,1); renderSection('sec-findings'); refreshSummary(); }
function setFinding(i, field, val){
  state.findings[i][field]=val;
  if(field!=='text'){ renderSection('sec-findings'); refreshSummary(); }
}

function findingsList(){
  let html = '';
  if(state.findings.length===0){
    html += '<div class="empty-hint">No findings logged yet.</div>';
  }
  state.findings.forEach((f,i)=>{
    html += '<div class="finding-card">'
      + '<div class="finding-head"><span class="er-row-index">Finding '+(i+1)+'</span>'
      + '<button type="button" class="icon-btn" onclick="removeFinding('+i+')">&times;</button></div>'
      + textareaEl(f.text, 'oninput="setFinding('+i+',\'text\',this.value)"', 'Describe finding #'+(i+1)+'...')
      + '<div class="sev-seg" style="margin-top:8px;">'
      + '<button type="button" class="'+(f.severity==='Low'?'active low':'')+'" onclick="setFinding('+i+',\'severity\',\'Low\')">Low</button>'
      + '<button type="button" class="'+(f.severity==='Medium'?'active medium':'')+'" onclick="setFinding('+i+',\'severity\',\'Medium\')">Medium</button>'
      + '<button type="button" class="'+(f.severity==='High'?'active high':'')+'" onclick="setFinding('+i+',\'severity\',\'High\')">High</button>'
      + '</div></div>';
  });
  html += '<button type="button" class="btn-add" onclick="addFinding()">+ Add finding</button>';
  return html;
}

/* ============================================================
   LIGHTWEIGHT REFRESH
   ------------------------------------------------------------
   Yes/No taps, condition taps, and add/remove-row buttons used to
   call the full render(), which rebuilds EVERY card in the form
   (10 sections' worth of HTML) just to reflect one toggle. That's
   what made the dashboard feel slow. These only rebuild the one
   card that actually changed.
   ============================================================ */
function sectionIdForPath(path){
  if(path.indexOf('reportsAttachments.')===0) return 'sec-reports';
  if(path.indexOf('fieldCollection.')===0) return 'sec-field';
  if(path.indexOf('notebooks.')===0) return 'sec-notebooks';
  if(path.indexOf('officialReceipts.')===0) return 'sec-or';
  if(path.indexOf('confirmation.')===0) return 'sec-confirmation';
  if(path.indexOf('image.')===0) return 'sec-image';
  if(path.indexOf('inventory.')===0) return 'sec-inventory';
  if(path.indexOf('cash.')===0) return 'sec-cash';
  return null;
}
function renderSection(sectionId){
  if(!sectionId) return;
  const s = sections.find(x => x.id === sectionId);
  const el = document.getElementById(sectionId);
  if(s && el) el.outerHTML = s.render();
}
function refreshSummary(){
  const reviewWrap = document.getElementById('reviewWrap');
  if(reviewWrap) reviewWrap.innerHTML = renderReview();
  const sc = computeScore();
  const footerStatus = document.getElementById('footerStatus');
  if(footerStatus){
    footerStatus.innerHTML = (state.branch ? escHtml(state.branch)+' &middot; ' : '')
      + '<strong>'+sc.pct+'%</strong> checklist compliance so far ('+sc.yes+' yes, '+sc.no+' no)';
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const sheetHtml = sections.map(s => s.render()).join('');
  document.getElementById('main').innerHTML = sheetHtml;
  document.getElementById('reviewWrap').innerHTML = renderReview();
  document.getElementById('headSub').textContent = state.branch ? (state.branch + (state.auditDate?(' \u00b7 '+state.auditDate):'')) : 'New audit \u00b7 not yet submitted';
  const s = computeScore();
  const footerStatus = document.getElementById('footerStatus');
  footerStatus.innerHTML = (state.branch ? escHtml(state.branch)+' &middot; ' : '')
    + '<strong>'+s.pct+'%</strong> checklist compliance so far ('+s.yes+' yes, '+s.no+' no)';
  const submitBtn = document.getElementById('submitBtn');
  if(submitting){
    submitBtn.innerHTML = '<span class="spinner"></span> '+(editingSubmissionId ? 'Saving...' : 'Submitting...');
    submitBtn.disabled = true;
  } else {
    submitBtn.textContent = editingSubmissionId ? 'Save changes' : 'Submit audit';
    submitBtn.disabled = false;
  }
  applySearchHighlight(); // re-apply since #main was just rebuilt
}

document.getElementById('submitBtn').addEventListener('click', doSubmit);

function showToast(msg){
  const t = document.getElementById('toast');

}

/* ============================================================
   SEARCH (toolbar below header) — highlights matching questions,
   field labels, condition labels and section titles inside #main.
   ============================================================ */
const SEARCH_SELECTOR = '#main .q-text, #main .cond-label, #main .field > label, '
  + '#main .section-title .st-text, #main .pair-sub, #main .card-hint';

function applySearchHighlight(scrollToFirst){
  // undo any previous highlighting first
  document.querySelectorAll('#main mark.search-hit').forEach(m=>{
    const parent = m.parentNode;
    if(!parent) return;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  const countEl = document.getElementById('searchCount');
  searchMatches = []; searchIndex = -1;
  if(!searchQuery){ if(countEl) countEl.textContent = ''; return; }

  const q = searchQuery.toLowerCase();
  document.querySelectorAll(SEARCH_SELECTOR).forEach(el=>{
    const text = el.textContent;
    const idx = text.toLowerCase().indexOf(q);
    if(idx === -1) return;
    const before = text.slice(0, idx), match = text.slice(idx, idx+q.length), after = text.slice(idx+q.length);
    el.innerHTML = escHtml(before) + '<mark class="search-hit">' + escHtml(match) + '</mark>' + escHtml(after);
    const markEl = el.querySelector('mark.search-hit');
    if(markEl) searchMatches.push(markEl);
  });

  if(searchMatches.length){
    searchIndex = 0;
    searchMatches[0].classList.add('current');
    if(scrollToFirst){
      const card = searchMatches[0].closest('.card');
      (card||searchMatches[0]).scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
  if(countEl) countEl.textContent = searchMatches.length ? (searchIndex+1)+'/'+searchMatches.length : 'No matches';
}

function goToSearchMatch(dir){
  if(!searchMatches.length) return;
  searchMatches[searchIndex].classList.remove('current');
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  const cur = searchMatches[searchIndex];
  cur.classList.add('current');
  (cur.closest('.card')||cur).scrollIntoView({behavior:'smooth', block:'center'});
  const countEl = document.getElementById('searchCount');
  if(countEl) countEl.textContent = (searchIndex+1)+'/'+searchMatches.length;
}

function onSearchInput(v){
  searchQuery = v.trim();
  document.getElementById('searchClearBtn').style.display = searchQuery ? 'flex' : 'none';
  applySearchHighlight(true);
}
function onSearchKeydown(e){
  if(e.key === 'Enter'){ e.preventDefault(); goToSearchMatch(e.shiftKey ? -1 : 1); }
  else if(e.key === 'Escape'){ clearSearch(); }
}
function clearSearch(){
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  searchQuery = '';
  document.getElementById('searchClearBtn').style.display = 'none';
  applySearchHighlight(false);
}

/* ============================================================
   PREVIEW ("Audit Findings" document) — auto-drafts a narrative
   write-up (matching the branch's plain-language findings report
   style) from the checklist answers already entered, then shows
   it full-screen and editable so the auditor can tidy the wording
   before downloading it as a Word (.doc) file ready to send.
   ============================================================ */
function fmtLongDateUpper(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length !== 3) return String(iso).toUpperCase();
  const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  if(isNaN(d.getTime())) return String(iso).toUpperCase();
  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function condGood(path, goodVals){
  goodVals = goodVals || ['Good','Complete'];
  return goodVals.indexOf(get(path+'.condition')) !== -1;
}
function statusGood(path){
  const s = get(path+'.status');
  return s === 'Complete' || s === 'Good';
}
function ynTrue(path){ return get(path) === true; }
/* Appends "(N unit/s)" to a finding sentence when a count was logged
   for that inventory row, so the auto-drafted narrative and the
   detail-tab sheet both surface how many units were actually counted,
   not just a Good/Fair/Poor rating. */
function countSuffix(path){
  const n = get(path+'.count');
  if(n === '' || n == null) return '';
  const num = Number(n);
  if(isNaN(num)) return '';
  return ' (' + num + ' unit' + (num===1?'':'s') + ')';
}

/* Each rule becomes one bullet under BRANCH when its check passes.

const FINDINGS_RULES = [

  { test:()=>ynTrue('reportsAttachments.vouchersSigned'), pos:'Cash receipt vouchers are signed by designated personnel.' },
  { test:()=>ynTrue('officialReceipts.cutoffSigned'), pos:'Collectors\u2019 receipts have cut-off signatures of the cashier.' },
  { test:()=>ynTrue('officialReceipts.greenCopiesOrganized'), pos:'Green copies of official receipts are well organized.' },

  { test:()=>['notebooks.cashReceiptJournal','notebooks.salesJournal','notebooks.registrationNotebook','notebooks.closedAccountNotebook'].every(ynTrue),

  { test:()=>condGood('inventory.repoUnits'), pos:()=>'Repossessed units were reconciled with the actual count'+countSuffix('inventory.repoUnits')+'.' },

  { test:()=>condGood('inventory.serviceUnits'), pos:()=>'Issued service units are recorded in the system inventory'+countSuffix('inventory.serviceUnits')+'.' },
